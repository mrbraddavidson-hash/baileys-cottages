    function renderGrid(filteredList) {
      const grid = document.getElementById('gallery-grid');
      grid.innerHTML = filteredList.map(p => `
        <div onclick="openLightbox('${p.src}', 'Photo #${p.id} • ${p.category} (${p.size_kb} KB)')"

            <span class="text-[10px] text-stone-300 truncate">${p.category}</span>
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    function filterPhotos(cat) {
      document.querySelectorAll('header button').forEach(b => {
        b.className = "px-3 py-1.5 rounded bg-stone-800 text-stone-300 hover:bg-stone-700";
      });
      if (cat === 'all') {
        document.getElementById('btn-all').className = "px-3 py-1.5 rounded bg-amber-600 text-white font-bold";
        renderGrid(photos);
      } else {
        event.target.className = "px-3 py-1.5 rounded bg-amber-600 text-white font-bold";
        const filtered = photos.filter(p => p.category === cat);
        renderGrid(filtered);
      }
    }

    function openLightbox(src, caption) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox-caption').textContent = caption;
      const lb = document.getElementById('lightbox');
      lb.classList.remove('hidden');
      lb.classList.add('flex');
    }

    function closeLightbox() {
      const lb = document.getElementById('lightbox');
      lb.classList.add('hidden');
      lb.classList.remove('flex');
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        closeLightbox();
      }
    });

    renderGrid(photos);
  </script>
